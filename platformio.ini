; ==============================================================================
; PlatformIO Configuration for RocNet ESP32 Controller
; Board: Wemos Lolin32 Lite
; Framework: Arduino / ESP32
; ==============================================================================

[platformio]
default_envs = lolin32_lite

[env:lolin32_lite]
platform = espressif32
board = lolin32_lite
framework = arduino

; Serial Monitor configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; Upload speed (reduced to 460800 for reliable CH340/Lolin32 flashing)
upload_speed = 460800

; Compiler & debugging flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -Ilib

; Required libraries
lib_deps = 
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    makuna/NeoPixelBus @ ^2.8.0
